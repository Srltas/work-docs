">80 08</text><rect x="258" y="358" width="78" height="36" rx="5" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.2"/><text x="297" y="380" font-family="SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="12.5" font-weight="normal" text-anchor="middle" fill="#1f2328">00 00</text><rect x="342" y="358" width="120" height="36" rx="5" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.2"/><text x="402" y="380" font-family="SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="12.5" font-weight="normal" text-anchor="middle" fill="#1f2328">00 00 00 00</text><text x="468" y="381" font-family="-apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', 'Segoe UI', sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#59636e">9바이트에서 끝나고 바로 묶음 2</text><text x="24" y="418" font-family="-apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', 'Segoe UI', sans-serif" font-size="12.5" font-weight="normal" text-anchor="start" fill="#59636e">데이터 타입 2바이트: 첫 바이트 0x80은 2바이트 형식 표시(V7부터), 둘째 바이트는 데이터 타입 번호(CCI_U_TYPE, 0x15 = 21).</text><text x="24" y="438" font-family="-apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', 'Segoe UI', sans-serif" font-size="12.5" font-weight="normal" text-anchor="start" fill="#59636e">모드: 1 IN, 2 OUT, 3 INOUT. 저장 프로시저 매개변수에는 크기를 선언할 수 없어 CALL 문의 scale·precision은 0이다.</text></svg>
